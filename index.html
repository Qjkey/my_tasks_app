<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Планер</title>
  <script src="js/tma.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- ===== Главная: задачи ===== -->
    <section id="tab-week" class="tab active" aria-label="Неделя">
      <header class="top-bar">
        <button type="button" id="btn-edit" class="icon-btn" title="Редактировать" aria-label="Редактировать">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
        </button>

        <button type="button" id="day-selector" class="day-selector" aria-haspopup="listbox" aria-expanded="false">
          <span id="current-day-label">Понедельник</span>
          <svg class="chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        <button type="button" id="btn-to-streak" class="icon-btn" title="Огонёк" aria-label="Огонёк">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 2c.4 3.2-1.6 5.4-3.2 7C7 10.7 6 12.5 6 15a6 6 0 0 0 12 0c0-2.8-1.2-4.8-2.4-6.4C14.3 7 13.2 5.5 12 2z" opacity=".9"/>
          </svg>
        </button>
      </header>

      <div id="day-menu" class="day-menu hidden" role="listbox" aria-label="День недели">
        <!-- filled by JS -->
      </div>

      <div id="edit-toolbar" class="edit-toolbar hidden">
        <button type="button" id="btn-add-task" class="toolbar-btn primary">Добавить</button>
        <button type="button" id="btn-paste-code" class="toolbar-btn">Код задач</button>
        <button type="button" id="btn-done-edit" class="toolbar-btn">Готово</button>
      </div>

      <main id="task-list" class="task-list" aria-live="polite"></main>
    </section>

    <!-- ===== Огонёк ===== -->
    <section id="tab-streak" class="tab" aria-label="Огонёк">
      <div class="streak-hero">
        <div class="flame-wrap" aria-hidden="true">
          <svg class="flame-icon" viewBox="0 0 64 80" width="88" height="110" aria-hidden="true">
            <path fill="currentColor" d="M32 4c2 10-6 16-11 22-6 7-9 13-9 22a20 20 0 0 0 40 0c0-10-4-17-8-23C39 18 35 12 32 4z"/>
            <path fill="var(--button-text)" opacity=".35" d="M32 42c1 4-2 7-4 9-2 2-3 4-3 7a7 7 0 0 0 14 0c0-3-1-5-3-7-2-2-4-5-4-9z"/>
          </svg>
        </div>
        <p id="streak-count" class="streak-count">0 дней</p>
      </div>

      <div class="week-calendar" aria-label="Календарь недели">
        <div class="week-calendar-head" id="week-calendar-head"></div>
        <div class="week-calendar-row" id="week-calendar-row"></div>
      </div>
    </section>

    <!-- ===== Адаптивные списки ===== -->
    <section id="tab-lists" class="tab" aria-label="Списки">
      <header class="lists-header">
        <h1 class="lists-heading">Списки</h1>
      </header>
      <main id="lists-root" class="task-list lists-root"></main>
    </section>
  </div>

  <!-- Модалка добавления задачи -->
  <div id="modal-add" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-add-title">
    <div class="modal-backdrop" data-close="modal-add"></div>
    <div class="modal-sheet">
      <h2 id="modal-add-title">Новая задача</h2>
      <input type="text" id="add-task-input" class="modal-input" placeholder="Название задачи" maxlength="200" autocomplete="off" />
      <input type="text" id="add-task-desc" class="modal-input" placeholder="Описание (необязательно, до 64)" maxlength="64" autocomplete="off" />
      <div class="modal-actions">
        <button type="button" class="modal-btn ghost" data-close="modal-add">Отмена</button>
        <button type="button" class="modal-btn accent" id="btn-confirm-add">Добавить</button>
      </div>
    </div>
  </div>

  <!-- Модалка кода задач -->
  <div id="modal-code" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-code-title">
    <div class="modal-backdrop" data-close="modal-code"></div>
    <div class="modal-sheet wide">
      <h2 id="modal-code-title">Код задач</h2>
      <p class="modal-hint">Описание: [] { Название | текст }. Списки: [{1}] { Покупки } и пункты «-». В дне: [{1}]. Код включает все задачи, в том числе добавленные в интерфейсе.</p>
      <textarea id="code-textarea" class="code-area" spellcheck="false" placeholder="(понедельник)&#10;[] { Задача | описание }"></textarea>
      <div class="modal-actions">
        <button type="button" class="modal-btn ghost" data-close="modal-code">Отмена</button>
        <button type="button" class="modal-btn accent" id="btn-save-code">Сохранить</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
